name: Build tfih jar

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Minecraft version to build"
        required: true
        default: "26.2"
        type: choice
        options:
          - "26.2"
          - "26.1"
          - "1.21.11"
          - "1.21.10"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Verify Gradle wrapper jar
        uses: gradle/actions/wrapper-validation@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew ":${{ inputs.version }}:buildAndCollect" --no-daemon --stacktrace \
            -Porg.gradle.java.installations.fromEnv=JAVA_HOME_21_X64,JAVA_HOME_25_X64 \
            -Porg.gradle.java.installations.auto-download=false

      - name: Show what was built
        run: find . -name "*.jar" -path "*build*" -not -path "./gradle/*" | sort

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: tfih-${{ inputs.version }}
          path: |
            build/output/*.jar
            build/libs/*.jar
            versions/${{ inputs.version }}/build/libs/*.jar
          if-no-files-found: error
